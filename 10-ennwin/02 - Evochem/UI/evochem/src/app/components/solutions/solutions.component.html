

<div class="page-title-default" [ngStyle]="{'background-image': 'url(' + 'assets/image/solutions/desktop-Jobs-to-be-done-banner_2x.webp' + ')'}">
    <div class="container">
        <h1 class="entry-title title">{{selectedSolutionType?.solutionType}}</h1>

    </div>
</div>
<div class="container">

    
    <div class="bathroom-cleaning  ">
        <div class="container-fluid">
            <div class="div-containher">
               
                <div class="div-sectiond">
                    <p class="focusare">{{selectedSolutionType?.title}}</p>
                  
                </div>
                <p class="jobsTobeDoneBlwBannerText">{{selectedSolutionType?.description}}</p>
                <!--<div class="downloadpdf">
                    <div class="div-button">
                        <img src="assets/image/solutions/pdf-icon.svg" alt="">
                        <p>Download Restroom Cleaning Procedures</p>
                    </div>
                </div>-->
                
            </div>
            <div id="sidenav">
                <div class="row">
                   
                    <div class="col-lg-3">
    
                        <div class="leftside-linkw">
                            <ul class="ul_list" role="list">
                                <li *ngFor="let solution of selectedSolutionType?.solutions; let i = index" class="li_lst">
                                    <button type="button" class="solution-list-btn"
                                            [class.selected]="selectedSolutionType.solutions[i].title === selectedSolution?.title"
                                            [attr.aria-current]="selectedSolutionType.solutions[i].title === selectedSolution?.title ? 'true' : null"
                                            (click)="selectSolution(solution)">
                                        <span class="solution-list-num">{{i+1}}</span>
                                        <span class="solution-list-text">{{ solution?.title }}</span>
                                    </button>
                                </li>
                            </ul>
                            <div class="phone-view-tabs">
                                <select class="form-select" (change)="onSelectChange($event)">
                                    <option *ngFor="let solution of selectedSolutionType?.solutions; let i = index" 
                                            [value]="solution?.title" 
                                            [ngClass]="{'selected': solution?.title === selectedSolution?.title}">
                                      {{i+1}}. {{ solution?.title }}
                                    </option>
                                  </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-9">
                        <div *ngIf="selectedSolutionType?.solutionType === 'Bathroom Cleaning'" class="bathroom-cleaning pointer_section mt-0">
                            <div class="div-sectiond m-0 p-0">
                                <p class="info-hint" role="note">
                                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                                    Select a number on the diagram to learn how to best clean that area.
                                </p>
                            </div>
                            <div id="prodList">
                                <div class="bannerSection  ">
                                    <span style=" display: inline-block;    position: relative; ">
                                        <span>
                                            <img src="assets/image/solutions/downloadbg.svg" alt="" loading="lazy" style="max-width: 100%; ">
                                        </span>
                                        <img src="assets/image/solutions/area.webp" class="bannerImage  ">
                                    </span>
                                    <div>
                                        <button *ngFor="let solution of selectedSolutionType.solutions; let i = index"
                                                [ngClass]="{'active': i === indexof(selectedSolution)}"
                                                class="bannerButton-{{i}} bannerButtons"
                                                type="button"
                                                (click)="selectSolutionFromIndex(i)">
                                          {{ i+1 }}
                                        </button>
                                      </div>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="selectedSolutionType?.solutionType == 'Commercial Kitchen Cleaning'" class="kitchen-cleaning pointer_section mt-0">
                            <div id="prodList">
                                <div class="bannerSection  ">
                                    <span style=" display: inline-block;    position: relative; ">
                                        <span>
                                            <img src="assets/image/solutions/downloadbg.svg" alt="" loading="lazy" style="max-width: 100%; ">
                                        </span>
                                        <img src="assets/image/solutions/11-focus-area-for-a-clean-and-Sanitary-kitchen_2x.webp"
                                            class="bannerImage  ">
                                    </span>
                                    <div>
                                        <button *ngFor="let num of selectedSolutionType.solutions; let i = index"
                                                [ngClass]="{'active': i === indexof(selectedSolution)}"
                                                class="bannerButton-{{i}} bannerButtons"
                                                type="button"
                                                (click)="selectSolutionFromIndex(i)">
                                          {{ i+1 }}
                                        </button>
                                      </div>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="selectedSolutionType?.solutionType == 'Laundry Cleaning'" class="laundry-cleaning pointer_section mt-0">
                            <div id="prodList">
                                <div class="bannerSection  ">
                                    <span style=" display: inline-block;    position: relative; ">
                                        <span>
                                            <img src="assets/image/solutions/downloadbg.svg" alt="" loading="lazy" style="max-width: 100%; ">
                                        </span>
                                        <img src="assets/image/solutions/Desktop-Laundry-and-Linen-filter_2x.webp"
                                            class="bannerImage  ">
                                    </span>
                                    <div>
                                        <button *ngFor="let num of selectedSolutionType.solutions; let i = index"
                                                [ngClass]="{'active': i === indexof(selectedSolution)}"
                                                class="bannerButton-{{i}} bannerButtons"
                                                type="button"
                                                (click)="selectSolutionFromIndex(i)">
                                          {{ i+1 }}
                                        </button>
                                      </div>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="selectedSolutionType?.solutionType == 'Surface & Air Clean'" class="surface-and-air-clean pointer_section mt-0">
                            <div id="prodList">
                                <div class="bannerSection  ">
                                    <span style=" display: inline-block;    position: relative; ">
                                        <span>
                                            <img src="assets/image/solutions/downloadbg.svg" alt="" loading="lazy" style="max-width: 100%; ">
                                        </span>
                                        <img src="assets/image/solutions/Desktop-Surface-and-Air-filter_2x.webp"
                                            class="bannerImage  ">
                                    </span>
                                    <div>
                                        <button *ngFor="let num of selectedSolutionType.solutions; let i = index"
                                                [ngClass]="{'active': i === indexof(selectedSolution)}"
                                                class="bannerButton-{{i}} bannerButtons"
                                                type="button"
                                                (click)="selectSolutionFromIndex(i)">
                                          {{ i+1 }}
                                        </button>
                                      </div>
                                </div>
                            </div>
                        </div>
                        <div class="">
                           
                                <div class="row p-0">
                                    <div class="col-lg-10 col-12">
                                        <p>{{selectedSolution?.description}}</p>
                                    </div>
                                    
                                    <div class="col-lg-4 col-md-4 col-sm-6 col-12 p-0 m-1 product-card" *ngFor="let product of selectedSolution.products">
                                        <button type="button" class="contentpro-sub contentpro-sub--btn" (click)="goToProductPage(getProduct(product))" [attr.aria-label]="'View product ' + getProduct(product)?.title">
                                            <div class="image">
                                                <img [src]="getProduct(product)?.thumbnail" [alt]="getProduct(product)?.title || 'Product'" loading="lazy">
                                            </div>
                                            <div class="div-content">
                                                <h4>{{getProduct(product)?.title}}</h4>
                                                <p>{{getProduct(product)?.details?.description}}</p>
                                            </div>
                                        </button>
                                    </div>
                                </div>
                           
                         
                        </div>
                    </div>
                </div>
            </div>
        </div>
      
    </div>
</div>
