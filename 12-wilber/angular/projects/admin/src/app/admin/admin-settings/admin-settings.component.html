<div class="admin-settings-container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary">
      <i class="fas fa-cogs me-2"></i>Configuration Settings
    </h3>
  </div>

  <!-- Settings Navigation Tabs -->
  <div class="card mb-4">
    <div class="card-header">
      <ul class="nav nav-tabs card-header-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link" 
                  [class.active]="activeSettingsView === 'platform'"
                  (click)="setActiveView('platform')"
                  type="button" 
                  role="tab">
            <i class="fas fa-store me-2"></i>Store Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" 
                  [class.active]="activeSettingsView === 'payment'"
                  (click)="setActiveView('payment')"
                  type="button" 
                  role="tab">
            <i class="fas fa-credit-card me-2"></i>Payment Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" 
                  [class.active]="activeSettingsView === 'shipping'"
                  (click)="setActiveView('shipping')"
                  type="button" 
                  role="tab">
            <i class="fas fa-shipping-fast me-2"></i>Shipping Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" 
                  [class.active]="activeSettingsView === 'sms'"
                  (click)="setActiveView('sms')"
                  type="button" 
                  role="tab">
            <i class="fas fa-sms me-2"></i>SMS Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link"
                  [class.active]="activeSettingsView === 'email'"
                  (click)="setActiveView('email')"
                  type="button"
                  role="tab">
            <i class="fas fa-envelope me-2"></i>Email Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link"
                  [class.active]="activeSettingsView === 'analytics'"
                  (click)="setActiveView('analytics')"
                  type="button"
                  role="tab">
            <i class="fas fa-chart-line me-2"></i>Analytics
          </button>
        </li>
        <li class="nav-item" role="presentation" *ngIf="canManageCoupons">
          <button class="nav-link"
                  [class.active]="activeSettingsView === 'coupons'"
                  (click)="setActiveView('coupons')"
                  type="button"
                  role="tab">
            <i class="fas fa-ticket-alt me-2"></i>Coupons
          </button>
        </li>
      </ul>
    </div>
    <div class="card-body">
      <div *ngIf="store.loading() && !store.settings()" class="text-center py-5 text-muted">
        <i class="fas fa-spinner fa-spin me-2"></i>Loading settings...
      </div>
      <div *ngIf="loadError" class="alert alert-danger d-flex justify-content-between align-items-center">
        <span><i class="fas fa-exclamation-triangle me-2"></i>{{ loadError }}</span>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="reload()">Retry</button>
      </div>
      <ng-container *ngIf="store.settings()">
      <!-- Platform Settings -->
      <div *ngIf="activeSettingsView === 'platform'" class="tab-content">
        <app-admin-platform-settings></app-admin-platform-settings>
      </div>

      <!-- Payment Settings -->
      <div *ngIf="activeSettingsView === 'payment'" class="tab-content">
        <app-admin-payment-settings></app-admin-payment-settings>
      </div>

      <!-- Shipping Settings -->
      <div *ngIf="activeSettingsView === 'shipping'" class="tab-content">
        <app-admin-shipping-settings></app-admin-shipping-settings>
      </div>

      <!-- SMS Settings -->
      <div *ngIf="activeSettingsView === 'sms'" class="tab-content">
        <app-admin-sms-settings></app-admin-sms-settings>
      </div>

      <!-- Email Settings -->
      <div *ngIf="activeSettingsView === 'analytics'" class="tab-content">
        <app-admin-analytics-settings></app-admin-analytics-settings>
      </div>

      <div *ngIf="activeSettingsView === 'email'" class="tab-content">
        <app-admin-email-settings></app-admin-email-settings>
      </div>
      </ng-container>

      <!-- Coupons (own permission; loads independently) -->
      <div *ngIf="activeSettingsView === 'coupons' && canManageCoupons" class="tab-content">
        <app-admin-coupons-settings></app-admin-coupons-settings>
      </div>
    </div>
  </div>
</div>
