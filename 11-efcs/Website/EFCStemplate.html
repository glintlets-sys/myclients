<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFCS Enquiry Form</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #50735f;
            font-weight: 400;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
            color: black;
        }
        th {
            background-color: #f4f4f9;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            max-width: 140px;
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="logo">
            <img src="https://glintcloudshopuploads.s3.ap-south-1.amazonaws.com/templates/efcs.jpeg" alt="">
         </div> 
        <table> 
            <tr>
                <td>Your Name</td>
                <td>{{fullName}}</td>
            </tr> 
            <tr>
                <td>Email ID</td>
                <td>{{email}}</td>
            </tr>
            <tr>
                <td>Phone Number</td>
                <td>{{mobileNumber}}</td>
            </tr>
            <tr>
                <td>Address </td>
                <td>{{address}}</td>
            </tr>
            <tr>
                <td>Message </td>
                <td>{{message}}</td>
            </tr>
            <tr>
                <td>Type Of Service</td>
                <td>{{businessType}}</td>
            </tr>
            <tr>
                <td>Date of Visit</td>
                <td>{{dob}}</td>
            </tr> 
           
            
        </table>
    </div>
</body>
</html>
